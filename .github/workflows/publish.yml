name: Publish companion site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No notebook Python/R runs at build time: the {pyodide} and {webr}
      # cells execute in the reader's browser. The quarto-live extension is
      # committed under _extensions/, so the render is hermetic.
      #
      # The project's post-render step does run python3 (preinstalled on
      # ubuntu-latest) to strip Quarto's cdnjs polyfill. It exits non-zero, and
      # so fails this build, only if a cdnjs reference survives -- i.e. Quarto
      # changed the tag and the site would otherwise start making a third-party
      # request again. If Quarto simply stops emitting it, the step passes and
      # says so. See tools/strip_polyfill.py.
      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
