project:
  # Ship the font licences with the fonts: OFL-1.1 condition 2 requires the
  # copyright notice and licence to travel with every copy of the font software.
  resources:
    - fonts/OFL-*.txt
    # MathJax loads its fonts at run time, so Quarto cannot discover them by
    # scanning the output; copy the whole directory explicitly.
    - mathjax/**

  # Quarto hardcodes a cdnjs ES6 polyfill into every MathJax page with no option to
  # suppress it. This site needs WebAssembly to run Pyodide and WebR, so every
  # browser that can use it already has ES6; the polyfill is a third-party request
  # that can never help. See tools/strip_polyfill.py.
  post-render:
    - python3 tools/strip_polyfill.py
  type: website
  output-dir: _site
  render:
    - index.qmd
    - chapters/*.qmd

