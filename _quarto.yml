format:
  live-html:
    theme: theme.scss
    # Fonts are self-hosted (fonts/ + fonts.css), not loaded from the Google Fonts
    # CDN. All three are SIL OFL-1.1; the licences ship in fonts/OFL-*.txt. This
    # keeps reader IP addresses off a third-party host and removes a runtime
    # dependency; see README.md, "License".
    css:
      - fonts.css
    # Self-hosted MathJax 3.2.2 (Apache-2.0, licence in mathjax/LICENSE) rather
    # than the jsDelivr CDN. Same version and same build Quarto loads by default,
    # so rendering is unchanged. MathJax resolves its font directory relative to
    # this script's own URL, which is why mathjax/output/... mirrors the upstream
    # layout and must not be flattened.
    html-math-method:
      method: mathjax
      url: mathjax/tex-chtml-full.js
    toc: true
    toc-title: "On this page"
    grid:
      sidebar-width: 290px
      body-width: 820px
      margin-width: 220px
    code-tools: false
